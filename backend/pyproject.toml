[project]
name = "voxmarket-backend"
version = "0.1.0"
description = "Voice-driven market-intelligence analyst — FastAPI backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "elasticsearch[async]>=8.17,<9",
    "openai>=1.60",
    "httpx>=0.27",
    "tenacity>=8.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavier / optional sponsor integrations. `uv sync --extra browser` etc.
browser = ["stagehand>=0.3"]
sentry = ["sentry-sdk[fastapi]>=2.0"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
