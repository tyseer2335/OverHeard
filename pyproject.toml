[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "product-voice"
version = "0.1.0"
description = "Collect YouTube product-review comments and analyze customer pain points in Elasticsearch"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=8.15,<10",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
  "vaderSentiment>=3.3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<7", "respx>=0.21,<1"]

[project.scripts]
product-voice = "product_voice.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/product_voice"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

